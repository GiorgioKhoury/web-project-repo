<!DOCTYPE html>

<html>
	<head>
		<title>Layout Practice</title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<div id="quiz-wrapper">
			<div id="form-wrap">
				<input id="username" type="text" placeholder="Username" required />
				<button onclick="tostart()">Begin Quiz</button>
			</div>
			<div id="bar">
				<hr id="timer">
			</div>
			<div id="question">
				<p>What is this quiz about?</p>
			</div>
			<hr>
			<div id="answers">
				<ul id="options-list">
					<li id="1" class="option" onclick="selectOption(1, 'correct')">[Option 1]</li>
					<li id="2" class="option" onclick="selectOption(2, 'incorrect')">[Option 2]</li>
					<li id="3" class="option" onclick="selectOption(3, 'incorrect')">[Option 3]</li>
					<li id="4" class="option" onclick="selectOption(4, 'incorrect')">[Option 4]</li>
				</ul>
			</div>
		</div>

		<script src="script.js">
		</script>
	</body>
</html>
